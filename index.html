<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/pwa-192x192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>古典単語学習アプリ</title>

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- PWAとモバイル対応のための設定 -->
    <link rel="apple-touch-icon" href="/pwa-192x192.png" sizes="192x192">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">
    <link rel="apple-touch-icon" href="/pwa-512x512.png" sizes="512x512">
    <meta name="theme-color" content="#81C784" />

    <!-- iOS向け設定 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="古文単語帳">

    <!-- ▼▼▼ 警告に対応して、この行を追加しました ▼▼▼ -->
    <meta name="mobile-web-app-capable" content="yes">

    <!-- Web フォント。CSS が大きい（圧縮後 約510KB）ので、画面と JS を止めない読み方にする：
         まず印刷用として読み（描画を止めない）、届いたら画面用に切り替える。届くまでは端末のフォントで出る
         （display=swap なので、今までも CSS が届いたあとは同じ順で切り替わっていた）。2026-11-16 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800;900&amp;family=Noto+Serif+JP:wght@400;500;600;700;800&amp;family=Zen+Maru+Gothic:wght@400;500;700;900&amp;family=Klee+One:wght@400;600&amp;family=JetBrains+Mono:wght@400;500;700;800&amp;display=swap" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800;900&amp;family=Noto+Serif+JP:wght@400;500;600;700;800&amp;family=Zen+Maru+Gothic:wght@400;500;700;900&amp;family=Klee+One:wght@400;600&amp;family=JetBrains+Mono:wght@400;500;700;800&amp;display=swap"></noscript>

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
